name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medical_db
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical_user -d medical_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: medical_db
      DB_USER: medical_user
      DB_PASSWORD: medical_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: http://localhost
      APP_VERSION: "0.4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Django system check
        run: python manage.py check --deploy

      - name: Migrations
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medical_db
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical_user -d medical_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000
      DB_NAME: medical_db
      DB_USER: medical_user
      DB_PASSWORD: medical_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: http://127.0.0.1:8000
      APP_VERSION: "0.4.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Start Django
        run: |
          python manage.py collectstatic --noinput
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/; then break; fi
            sleep 2
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Django log on failure
        if: failure()
        run: tail -100 /tmp/django.log

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.production.example .env.production
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env.production
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 16)/" .env.production

      - name: Build and start stack
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

      - name: Migrate and seed
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py migrate --noinput
          docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py seed_demo

      - name: Smoke check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/healthz/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "home HTTP %{http_code}\n" http://localhost/
          curl -fsS -o /dev/null -w "login HTTP %{http_code}\n" http://localhost/accounts/login/

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=120

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v
