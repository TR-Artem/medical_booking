name: medical_booking_dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: medical_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    logging: *default-logging

  # Локальный SMTP для демо: письма видны на http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging

  web:
    build: .
    restart: always
    command: gunicorn medical_booking.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    logging: *default-logging

  celery:
    build: .
    restart: always
    command: celery -A medical_booking worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    logging: *default-logging

  celery-beat:
    build: .
    restart: always
    command: celery -A medical_booking beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    logging: *default-logging

volumes:
  postgres_data:
  static_volume:
