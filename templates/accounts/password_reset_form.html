{% extends 'base.html' %}
{% block title %}Сброс пароля — МедЦентр{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card shadow-sm">
          <div class="auth-header text-center mb-4">
            <div class="auth-icon mb-3"><i class="bi bi-key-fill"></i></div>
            <h3 class="fw-700">Сброс пароля</h3>
            <p class="text-muted small">Укажите e-mail, на который зарегистрирован аккаунт</p>
          </div>

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-4">
              <label class="form-label fw-500">E-mail</label>
              <input type="email" name="email" required
                     class="form-control {% if form.email.errors %}is-invalid{% endif %}"
                     value="{{ form.email.value|default:'' }}"
                     placeholder="ivan@example.ru" autofocus>
              {% for err in form.email.errors %}
                <div class="invalid-feedback d-block">{{ err }}</div>
              {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
              <i class="bi bi-envelope me-2"></i>Отправить ссылку
            </button>
          </form>

          <hr class="my-4">
          <p class="text-center text-muted small mb-0">
            <a href="{% url 'accounts:login' %}" class="text-primary fw-500">Вернуться ко входу</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
