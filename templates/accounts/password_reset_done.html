{% extends 'base.html' %}
{% block title %}Письмо отправлено — МедЦентр{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card shadow-sm text-center">
          <div class="auth-icon mb-3"><i class="bi bi-envelope-check-fill"></i></div>
          <h3 class="fw-700 mb-3">Проверьте почту</h3>
          <p class="text-muted mb-4">
            Если аккаунт с таким e-mail существует, мы отправили ссылку для сброса пароля.
            Ссылка действует в течение часа.
          </p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary">Вернуться ко входу</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
