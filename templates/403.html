{% extends 'base.html' %}
{% block title %}Доступ запрещён — МедЦентр{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 text-center p-5">
        <div class="auth-icon mb-3"><i class="bi bi-shield-lock"></i></div>
        <h1 class="h4 fw-700 mb-2">Доступ запрещён</h1>
        <p class="text-muted mb-4">{{ message|default:"У вас нет прав для просмотра этого раздела." }}</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'core:home' %}" class="btn btn-primary">На главную</a>
          <a href="{% url 'appointments:doctor_list' %}" class="btn btn-outline-primary">К врачам</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
