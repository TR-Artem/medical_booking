name: medical_booking_prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging

  # SMTP-приёмник для демо. Веб-интерфейс доступен только с сервера:
  # ssh -L 8025:127.0.0.1:8025 user@server → http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    logging: *default-logging

  web:
    build: .
    restart: unless-stopped
    command: gunicorn medical_booking.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env.production
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    logging: *default-logging

  celery:
    build: .
    restart: unless-stopped
    command: celery -A medical_booking worker --loglevel=info
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    logging: *default-logging

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A medical_booking beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    logging: *default-logging

  tools:
    build:
      context: .
      args:
        INSTALL_DEV: "1"
    env_file:
      - .env.production
    environment:
      # Тесты не должны трогать боевой брокер и SMTP.
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      CACHE_URL: "redis://redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["tools"]
    logging: *default-logging

volumes:
  postgres_data:
  static_volume:
